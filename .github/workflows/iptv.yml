name: 从私有仓库同步文件

on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'  # UTC 22:00 = 上海时间次日早晨6:00
    - cron: '0 10 * * *'  # UTC 10:00 = 上海时间下午6:00

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 签出公开仓库
        uses: actions/checkout@v4
      - name: 设置Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: 安装依赖
        run: pip install requests
      - name: 同步文件
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
        run: python .github/scripts/sync.py
