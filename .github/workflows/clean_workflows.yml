name: Auto Delete Old Workflow Runs

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
Actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Delete old runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
仓库: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 1
