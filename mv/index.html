<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>MV音乐精选 · 智能排序</title>
    <style>
        /* ---------- 全局重置 & 基础 ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(145deg, #0b0c1a, #12172f);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
        }

        .container {
            width: 100%;
            max-width: 1600px;
            height: 100vh;
            max-height: 900px;
            background: rgba(255, 255, 255, 0.97);
            padding: 12px 16px 8px;
            display: flex;
            flex-direction: column;
            border-radius: 28px;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.45);
            overflow: hidden;
            backdrop-filter: blur(2px);
            transition: all 0.2s;
        }

        /* ---------- 头部 ---------- */
        .header {
            text-align: center;
            flex-shrink: 0;
            padding-bottom: 6px;
        }

        h1 {
            font-size: clamp(1.3rem, 4vw, 2.1rem);
            background: linear-gradient(125deg, #4f7df3, #b345d6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1.2;
            letter-spacing: 0.3px;
        }

        .subtitle {
            color: #5a6874;
            font-size: clamp(0.6rem, 2.2vw, 0.75rem);
            opacity: 0.9;
        }

        /* ---------- 统计卡片 ---------- */
        .stats-card {
            background: #f0f3fa;
            border-radius: 40px;
            padding: 6px 18px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px 12px;
            flex-shrink: 0;
            min-height: 38px;
        }

        .stats-info {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .stat-badge,
        .orientation-badge {
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
            white-space: nowrap;
            background: white;
            color: #4f7df3;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
        }

        .orientation-badge {
            background: #e2e8f2;
            color: #2c3e50;
        }

        .search-info {
            font-size: 0.65rem;
            background: #eef2ff;
            padding: 4px 14px;
            border-radius: 40px;
            white-space: nowrap;
            transition: all 0.2s;
            font-weight: 500;
        }

        /* ---------- 排序栏 ---------- */
        .sort-bar {
            display: flex;
            gap: 8px 12px;
            flex-shrink: 0;
            background: #f8fafc;
            padding: 6px 14px;
            border-radius: 40px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 8px;
            border: 1px solid #eef2f6;
        }

        .sort-buttons {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .sort-btn {
            background: white;
            border: 1px solid #dce2ec;
            padding: 5px 16px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #334155;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
        }

        .sort-btn:hover {
            background: #eef2ff;
            border-color: #b8c5e0;
        }

        .sort-btn.active {
            background: linear-gradient(110deg, #4f7df3, #a158e0);
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(79, 125, 243, 0.3);
        }

        .sort-btn.reset-rank {
            background: #f1f5f9;
            color: #475569;
        }
        .sort-btn.reset-rank:hover {
            background: #fee2e2;
            color: #b91c1c;
            border-color: #fecaca;
        }

        .sort-hint {
            font-size: 0.6rem;
            color: #6c7a8c;
            margin-left: auto;
            font-weight: 500;
        }

        /* ---------- 搜索栏 ---------- */
        .search-section {
            flex-shrink: 0;
            margin-bottom: 10px;
        }

        .search-box {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        .search-input {
            flex: 1;
            padding: 10px 18px;
            border: 1.5px solid #e2e8f0;
            border-radius: 44px;
            font-size: 0.8rem;
            outline: none;
            background: white;
            min-width: 0;
            transition: border 0.2s, box-shadow 0.2s;
        }

        .search-input:focus {
            border-color: #4f7df3;
            box-shadow: 0 0 0 4px rgba(79, 125, 243, 0.12);
        }

        .search-btn {
            padding: 10px 20px;
            background: linear-gradient(110deg, #4f7df3, #a158e0);
            color: white;
            border: none;
            border-radius: 44px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: opacity 0.15s, transform 0.1s;
        }
        .search-btn:hover {
            opacity: 0.9;
        }
        .search-btn:active {
            transform: scale(0.97);
        }

        .search-btn.reset {
            background: #6c7a8c;
        }
        .search-btn.reset:hover {
            background: #5a6874;
        }

        /* ---------- MV列表容器 ---------- */
        .mv-list-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            border-radius: 20px;
            min-height: 0;
            -webkit-overflow-scrolling: touch;
            padding-right: 4px;
            margin-bottom: 2px;
        }

        .mv-list-container::-webkit-scrollbar {
            width: 5px;
        }
        .mv-list-container::-webkit-scrollbar-track {
            background: #eef2ff;
            border-radius: 10px;
        }
        .mv-list-container::-webkit-scrollbar-thumb {
            background: #b9c3e9;
            border-radius: 10px;
        }

        /* ---------- MV列表：竖屏 ---------- */
        @media (orientation: portrait) {
            .mv-list {
                display: flex;
                flex-direction: column;
                gap: 10px;
                padding-bottom: 6px;
            }

            .mv-item {
                background: white;
                border-radius: 20px;
                padding: 14px 18px;
                display: flex;
                align-items: center;
                gap: 14px;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
                border: 1px solid #eef2ff;
                cursor: pointer;
                transition: all 0.12s ease;
                position: relative;
            }
            .mv-item:active {
                background: #f5f7ff;
                transform: scale(0.99);
            }

            .mv-number {
                flex-shrink: 0;
                min-width: 76px;
                background: linear-gradient(135deg, #4f7df3, #9b51e0);
                padding: 10px 0;
                border-radius: 36px;
                text-align: center;
                font-weight: 800;
                font-size: 0.85rem;
                color: white;
                letter-spacing: 0.5px;
                box-shadow: 0 2px 8px rgba(79, 125, 243, 0.2);
            }

            .mv-name {
                flex: 1;
                font-weight: 700;
                font-size: 0.98rem;
                line-height: 1.4;
                word-break: break-word;
                color: #111827;
            }

            .mv-artist {
                font-size: 0.78rem;
                font-weight: 600;
                color: #4f7df3;
                margin-left: 6px;
                display: inline-block;
            }

            .play-icon {
                font-size: 1.4rem;
                opacity: 0.4;
                flex-shrink: 0;
                margin-left: 4px;
                transition: opacity 0.2s;
            }
            .mv-item:hover .play-icon {
                opacity: 0.8;
            }

            .hot-badge {
                background: #ff6b6b;
                color: white;
                border-radius: 40px;
                padding: 2px 10px;
                font-size: 0.6rem;
                font-weight: 700;
                margin-left: 6px;
                display: inline-block;
                vertical-align: middle;
                box-shadow: 0 1px 6px rgba(255, 107, 107, 0.3);
            }
        }

        /* ---------- MV列表：横屏（网格） ---------- */
        @media (orientation: landscape) {
            .mv-list {
                display: grid;
                grid-template-columns: repeat(5, 1fr);
                gap: 14px;
                padding-bottom: 6px;
            }

            .mv-item {
                display: flex;
                flex-direction: column;
                align-items: center;
                text-align: center;
                padding: 18px 12px 14px;
                background: white;
                border-radius: 20px;
                cursor: pointer;
                transition: all 0.12s;
                border: 1px solid #eef2ff;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
                position: relative;
            }
            .mv-item:active {
                background: #f0f3ff;
                transform: scale(0.97);
            }

            .mv-number {
                padding: 6px 18px;
                margin-bottom: 10px;
                font-size: 0.8rem;
                font-weight: 800;
                background: linear-gradient(125deg, #4f7df3, #a853e6);
                border-radius: 40px;
                color: white;
                display: inline-block;
                box-shadow: 0 2px 8px rgba(79, 125, 243, 0.2);
            }

            .mv-name {
                font-size: 0.88rem;
                font-weight: 700;
                word-break: break-word;
                max-width: 100%;
                line-height: 1.4;
                margin-bottom: 4px;
            }

            .mv-artist {
                display: block;
                font-size: 0.72rem;
                font-weight: 500;
                margin-top: 4px;
                color: #6c5ce7;
            }

            .play-icon {
                margin-top: 10px;
                opacity: 0.4;
                font-size: 1.2rem;
                transition: opacity 0.2s;
            }
            .mv-item:hover .play-icon {
                opacity: 0.8;
            }

            .hot-badge {
                position: absolute;
                top: 8px;
                right: 8px;
                background: #ff6b6b;
                color: white;
                border-radius: 40px;
                padding: 2px 10px;
                font-size: 0.6rem;
                font-weight: 700;
                box-shadow: 0 1px 6px rgba(255, 107, 107, 0.3);
            }
        }

        @media (orientation: landscape) and (max-width: 1100px) {
            .mv-list { grid-template-columns: repeat(4, 1fr); gap: 12px; }
        }
        @media (orientation: landscape) and (max-width: 800px) {
            .mv-list { grid-template-columns: repeat(3, 1fr); gap: 10px; }
        }
        @media (orientation: landscape) and (max-width: 550px) {
            .mv-list { grid-template-columns: repeat(2, 1fr); gap: 8px; }
        }

        /* ---------- 通用组件 ---------- */
        .highlight {
            background: #fde047;
            color: #1e293b;
            padding: 2px 6px;
            border-radius: 12px;
            font-weight: 800;
            display: inline-block;
        }

        .empty-state,
        .loading {
            text-align: center;
            padding: 48px 20px;
            background: #f8faff;
            border-radius: 28px;
            color: #4b5563;
            border: 1px dashed #dce2ec;
        }

        .empty-state .icon,
        .loading .icon {
            font-size: 2.6rem;
            margin-bottom: 10px;
        }

        /* ---------- 移动端精细优化 ---------- */
        @media (max-width: 480px) and (orientation: portrait) {
            .container { padding: 6px 8px 4px; border-radius: 18px; max-height: 100vh; }
            .mv-item { padding: 12px 12px; gap: 10px; }
            .mv-number { min-width: 60px; font-size: 0.75rem; padding: 8px 0; }
            .mv-name { font-size: 0.85rem; }
            .mv-artist { font-size: 0.68rem; }
            .play-icon { font-size: 1.2rem; }
            .search-input { padding: 8px 14px; font-size: 0.75rem; }
            .search-btn { padding: 8px 14px; font-size: 0.7rem; }
            .sort-btn { padding: 4px 10px; font-size: 0.6rem; }
            .stats-card { padding: 4px 12px; }
            .stat-badge, .orientation-badge { font-size: 0.6rem; padding: 3px 10px; }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>🎵 MV音乐精选</h1>
            <div class="subtitle">🎬 00001-00035 连载 · 🎙️ 00036-01359 MV歌曲</div>
            <div class="subtitle" style="font-size:0.6rem;">🌐 数据源: cnliux.github.io/mv/ · ⚡ 智能排序(热度+搜索+随机)</div>
        </div>

        <!-- 统计卡片 -->
        <div class="stats-card">
            <div class="stats-info">
                <span class="stat-badge" id="totalCount">📀 加载中...</span>
                <span class="orientation-badge" id="orientationDisplay">📱 竖屏模式</span>
            </div>
            <div class="search-info" id="searchInfo">💡 搜索歌名/歌手/编号</div>
        </div>

        <!-- 排序栏 -->
        <div class="sort-bar">
            <div class="sort-buttons">
                <button class="sort-btn" data-sort="default">📌 编号</button>
                <button class="sort-btn active" data-sort="hot">🔥 热门</button>
                <button class="sort-btn" data-sort="random">🎲 随机</button>
                <button class="sort-btn reset-rank" id="resetRankBtn">🔄 重置热度</button>
            </div>
            <div class="sort-hint">⭐ 点击歌曲增加热度</div>
        </div>

        <!-- 搜索栏 -->
        <div class="search-section">
            <div class="search-box">
                <input type="text" id="searchInput" class="search-input" placeholder="🔍 搜索 MV 名称、歌手或编号..." autocomplete="off">
                <button id="searchBtn" class="search-btn">搜索</button>
                <button id="resetBtn" class="search-btn reset">重置</button>
            </div>
        </div>

        <!-- MV列表 -->
        <div class="mv-list-container" id="mvListContainer">
            <div id="mvList" class="mv-list">
                <div class="loading">
                    <div class="icon">🎶</div>
                    <div>正在加载MV列表...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ============================================================
            // 1. CDN 镜像配置（国内可用代理优先）
            // ============================================================
            const TXT_FILE_URLS = [
                // 🔥 国内高速代理（优先使用）
                'https://ghfast.top/https://raw.githubusercontent.com/cnliux/cnliux.github.io/main/mv/list.txt',
                'https://g.blfrp.cn/https://raw.githubusercontent.com/cnliux/cnliux.github.io/main/mv/list.txt',
                'https://cdn.gh-proxy.org/https://raw.githubusercontent.com/cnliux/cnliux.github.io/main/mv/list.txt',
                'https://ghproxy.net/https://raw.githubusercontent.com/cnliux/cnliux.github.io/main/mv/list.txt',
                // CDN 镜像
                'https://cdn.jsdelivr.net/gh/cnliux/cnliux.github.io@main/mv/list.txt',
                // 直连源（国内访问不稳定，作为最后备选）
                'https://raw.githubusercontent.com/cnliux/cnliux.github.io/main/mv/list.txt'
            ];

            const STORAGE_KEY = 'mv_click_counts_v3';
            const CACHE_KEY = 'mv_mirror_winner';

            // ---------- 状态 ----------
            let allMVList = [];
            let filteredMVList = [];
            let currentKeyword = '';
            let currentSortMode = 'hot';
            let clickMap = new Map();
            let isInitialized = false;

            // ---------- DOM 引用 ----------
            const $ = (id) => document.getElementById(id);
            const mvListEl = $('mvList');
            const totalCountEl = $('totalCount');
            const searchInfoEl = $('searchInfo');
            const orientationDisplayEl = $('orientationDisplay');
            const searchInput = $('searchInput');
            const searchBtn = $('searchBtn');
            const resetBtn = $('resetBtn');
            const resetRankBtn = $('resetRankBtn');

            // ============================================================
            // 2. 工具函数
            // ============================================================
            function getSongUniqueKey(item) {
                return `${item.id}|${item.name}|${item.artist || ''}`;
            }

            function escapeHtml(str) {
                if (!str) return '';
                const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
                return str.replace(/[&<>"']/g, m => map[m]);
            }

            function escapeRegex(str) {
                return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            }

            function highlightText(text, keyword) {
                if (!keyword || !text) return escapeHtml(text);
                const regex = new RegExp('(' + escapeRegex(keyword) + ')', 'gi');
                return escapeHtml(text).replace(regex, '<span class="highlight">$1</span>');
            }

            // ============================================================
            // 3. 点击计数管理 (持久化)
            // ============================================================
            function loadClickCounts() {
                try {
                    const stored = localStorage.getItem(STORAGE_KEY);
                    if (stored) {
                        const parsed = JSON.parse(stored);
                        clickMap = new Map(Object.entries(parsed));
                    } else {
                        clickMap = new Map();
                    }
                } catch (_) {
                    clickMap = new Map();
                }
            }

            function saveClickCounts() {
                try {
                    const obj = Object.fromEntries(clickMap);
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(obj));
                } catch (_) { /* ignore */ }
            }

            function incrementClickCount(item) {
                const key = getSongUniqueKey(item);
                const current = clickMap.get(key) || 0;
                clickMap.set(key, current + 1);
                saveClickCounts();
                updateClickCountsInList();
            }

            function updateClickCountsInList() {
                for (const mv of allMVList) {
                    mv.clickCount = clickMap.get(getSongUniqueKey(mv)) || 0;
                }
            }

            function resetAllClickCounts() {
                clickMap.clear();
                saveClickCounts();
                updateClickCountsInList();
                applyFilterAndSort();
            }

            // ============================================================
            // 4. 排序 & 搜索核心逻辑
            // ============================================================
            function getSearchBoost(item, keyword) {
                if (!keyword) return 0;
                const lowerKw = keyword.toLowerCase();
                const id = item.id.toLowerCase();
                const name = item.name.toLowerCase();
                const artist = (item.artist || '').toLowerCase();
                const full = item.fullName.toLowerCase();

                if (id === lowerKw) return 1.2;
                if (name === lowerKw) return 1.0;
                if (name.includes(lowerKw)) return 0.6;
                if (artist.includes(lowerKw)) return 0.5;
                if (full.includes(lowerKw)) return 0.3;
                if (id.includes(lowerKw)) return 0.4;
                return 0;
            }

            function getHotScore(item, keyword) {
                const base = item.clickCount || 0;
                if (!keyword) return base;
                const boost = getSearchBoost(item, keyword);
                return base * (1 + boost * 1.8);
            }

            function shuffleArray(arr) {
                const a = arr.slice();
                for (let i = a.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [a[i], a[j]] = [a[j], a[i]];
                }
                return a;
            }

            function sortMVList(list, keyword, sortMode) {
                if (sortMode === 'hot') {
                    const sorted = list.slice();
                    sorted.sort((a, b) => {
                        const scoreA = getHotScore(a, keyword);
                        const scoreB = getHotScore(b, keyword);
                        if (scoreA !== scoreB) return scoreB - scoreA;
                        return (parseInt(a.id) || 0) - (parseInt(b.id) || 0);
                    });
                    return sorted;
                } else if (sortMode === 'random') {
                    return shuffleArray(list);
                } else {
                    const sorted = list.slice();
                    sorted.sort((a, b) => (parseInt(a.id) || 0) - (parseInt(b.id) || 0));
                    return sorted;
                }
            }

            function applyFilterAndSort() {
                let working = allMVList.slice();
                const keyword = currentKeyword.trim();
                if (keyword) {
                    const lower = keyword.toLowerCase();
                    working = working.filter(item =>
                        item.id.includes(lower) ||
                        item.name.toLowerCase().includes(lower) ||
                        (item.artist && item.artist.toLowerCase().includes(lower)) ||
                        item.fullName.toLowerCase().includes(lower)
                    );
                }
                filteredMVList = sortMVList(working, keyword, currentSortMode);
                renderMVList();
            }

            // ============================================================
            // 5. 渲染引擎
            // ============================================================
            function renderMVList() {
                if (!filteredMVList.length) {
                    mvListEl.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">🎵</div>
                            <div>暂无匹配的MV</div>
                            <div style="font-size:0.75rem; margin-top:6px;">试试其他关键词吧</div>
                        </div>`;
                    updateStats();
                    return;
                }

                let html = '';
                const kw = currentKeyword.trim();
                for (const item of filteredMVList) {
                    const idHtml = kw ? highlightText(item.id, kw) : escapeHtml(item.id);
                    const nameHtml = kw ? highlightText(item.name, kw) : escapeHtml(item.name);
                    const artistHtml = item.artist ?
                        `<span class="mv-artist">- ${kw ? highlightText(item.artist, kw) : escapeHtml(item.artist)}</span>` :
                        '';
                    const clicks = item.clickCount || 0;
                    const badgeHtml = clicks > 0 ? `<span class="hot-badge">🔥 ${clicks}</span>` : '';

                    html += `
                        <div class="mv-item" 
                             data-fullname="${escapeHtml(item.fullName)}" 
                             data-id="${escapeHtml(item.id)}" 
                             data-name="${escapeHtml(item.name)}" 
                             data-artist="${escapeHtml(item.artist || '')}"
                             data-unique="${escapeHtml(getSongUniqueKey(item))}">
                            <div class="mv-number">${idHtml}</div>
                            <div class="mv-name">${nameHtml} ${artistHtml} ${badgeHtml}</div>
                            <div class="play-icon">▶️</div>
                        </div>`;
                }
                mvListEl.innerHTML = html;

                mvListEl.querySelectorAll('.mv-item').forEach(el => {
                    el.addEventListener('click', mvClickHandler);
                });
                updateStats();
            }

            // ---------- 点击处理 ----------
            function mvClickHandler(e) {
                const el = e.currentTarget;
                const fullName = el.dataset.fullname;
                const id = el.dataset.id;
                const name = el.dataset.name;
                const artist = el.dataset.artist || '';

                const mvItem = allMVList.find(m => m.fullName === fullName && m.id === id);
                if (mvItem) {
                    incrementClickCount(mvItem);
                    applyFilterAndSort();
                }

                const artistText = artist ? ` - ${artist}` : '';
                alert(`🎬 播放MV\n\n📀 编号: ${id}\n🎤 歌曲: ${name}${artistText}\n📁 文件: ${fullName}\n👍 感谢支持，热度 +1`);
            }

            // ---------- 统计 & UI 更新 ----------
            function updateStats() {
                const totalClicks = Array.from(clickMap.values()).reduce((sum, v) => sum + v, 0);
                totalCountEl.innerHTML = `🎵 共 ${allMVList.length} 首MV · 🔥 总点击: ${totalClicks}`;

                const kw = currentKeyword.trim();
                const modeMap = { hot: '🔥热门优先', random: '🎲随机模式', default: '📌编号排序' };
                const modeLabel = modeMap[currentSortMode] || '热门优先';

                if (kw && filteredMVList.length === 0) {
                    searchInfoEl.innerHTML = '😔 没有找到匹配的MV，试试其他关键词';
                    searchInfoEl.style.background = '#ffe6e6';
                } else if (kw) {
                    searchInfoEl.innerHTML = `🔍 找到 ${filteredMVList.length} 个相关MV (共 ${allMVList.length} 首) · ${modeLabel}`;
                    searchInfoEl.style.background = '#e0f2e6';
                } else {
                    searchInfoEl.innerHTML = `💡 输入MV名称、歌手或编号搜索 · ${modeLabel}`;
                    searchInfoEl.style.background = '#eef2ff';
                }
            }

            function updateOrientationDisplay() {
                const isLandscape = window.matchMedia('(orientation: landscape)').matches;
                if (isLandscape) {
                    orientationDisplayEl.innerHTML = '🖥️ 横屏 · 网格';
                    orientationDisplayEl.style.background = '#d4edda';
                    orientationDisplayEl.style.color = '#155724';
                } else {
                    orientationDisplayEl.innerHTML = '📱 竖屏 · 列表';
                    orientationDisplayEl.style.background = '#e9ecef';
                    orientationDisplayEl.style.color = '#495057';
                }
            }

            // ============================================================
            // 6. 搜索/排序控制接口
            // ============================================================
            function setSortMode(mode) {
                if (mode === currentSortMode) return;
                currentSortMode = mode;
                document.querySelectorAll('.sort-btn[data-sort]').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.sort === mode);
                });
                applyFilterAndSort();
            }

            function searchMV(keyword) {
                currentKeyword = keyword.trim();
                applyFilterAndSort();
            }

            function resetSearch() {
                searchInput.value = '';
                currentKeyword = '';
                applyFilterAndSort();
            }

            // ============================================================
            // 7. 数据加载引擎 (国内镜像优先 + 智能缓存)
            // ============================================================
            async function fetchWithFallback(urls) {
                // 优先使用缓存的成功镜像
                let orderedUrls = [...urls];
                try {
                    const cached = localStorage.getItem(CACHE_KEY);
                    if (cached && orderedUrls.includes(cached)) {
                        orderedUrls = [cached, ...orderedUrls.filter(u => u !== cached)];
                    }
                } catch (_) { /* ignore */ }

                const fetchWithTimeout = (url, timeout = 10000) => {
                    return new Promise((resolve, reject) => {
                        const controller = new AbortController();
                        const timer = setTimeout(() => {
                            controller.abort();
                            reject(new Error(`Timeout: ${url}`));
                        }, timeout);
                        fetch(url, { signal: controller.signal })
                            .then(res => {
                                clearTimeout(timer);
                                if (!res.ok) reject(new Error(`HTTP ${res.status}`));
                                resolve(res);
                            })
                            .catch(err => {
                                clearTimeout(timer);
                                reject(err);
                            });
                    });
                };

                const isValidContent = (text) => {
                    if (!text || text.length < 50) return false;
                    if (text.includes('<!DOCTYPE') || text.includes('<html')) return false;
                    return /\d+\..+\.(mp4|mp3|mkv|webm|flv|mov|avi)/i.test(text);
                };

                // 阶段1: 并行竞速（优先使用国内镜像）
                try {
                    const text = await Promise.any(
                        orderedUrls.map(async url => {
                            const response = await fetchWithTimeout(url);
                            const text = await response.text();
                            if (!isValidContent(text)) throw new Error('Invalid content');
                            try { localStorage.setItem(CACHE_KEY, url); } catch (_) {}
                            return text;
                        })
                    );
                    return text;
                } catch (_) {
                    // 阶段2: 顺序重试 (更宽松的超时)
                    for (const url of orderedUrls) {
                        try {
                            const response = await fetchWithTimeout(url, 12000);
                            const text = await response.text();
                            if (isValidContent(text)) {
                                try { localStorage.setItem(CACHE_KEY, url); } catch (_) {}
                                return text;
                            }
                        } catch (_) { /* continue */ }
                    }
                    throw new Error('所有镜像地址均不可用，请检查网络或稍后重试');
                }
            }

            // ============================================================
            // 8. 解析 MV 文件名
            // ============================================================
            function parseMVFileName(filename) {
                const match = filename.match(/^(\d+)\.(.+?)\.(mp4|mp3|mkv|webm|flv|mov|avi)$/i);
                if (!match) return { valid: false };
                const id = match[1];
                let namePart = match[2];
                if (!namePart || namePart.trim().length === 0 || /^\d+$/.test(namePart.trim())) {
                    return { valid: false };
                }

                let songName = namePart;
                let artist = '';
                if (namePart.includes('-')) {
                    const parts = namePart.split('-');
                    if (parts.length >= 2) {
                        artist = parts[0].trim();
                        songName = parts[1].trim();
                        if (songName.length < 2 && artist.length > 2) {
                            [songName, artist] = [artist, songName];
                        }
                    }
                } else if (namePart.includes('_')) {
                    const parts = namePart.split('_');
                    artist = parts[0].trim();
                    songName = parts[1] ? parts[1].trim() : parts[0].trim();
                }
                songName = songName.replace(/\[.*?\]|\(.*?\)/g, '').trim();
                artist = artist.replace(/\[.*?\]|\(.*?\)/g, '').trim();
                if (!songName) return { valid: false };

                return {
                    valid: true,
                    id,
                    name: songName,
                    artist,
                    fullName: filename,
                    ext: match[3],
                    clickCount: 0
                };
            }

            // ---------- 备用数据 ----------
            function getFallbackList() {
                const raw = [
                    "00001.王杰-一场游戏一场梦.mp4", "00002.陈奕迅-十年.mp4", "00003.林俊杰-江南.mp4",
                    "00070.李建复-龙的传人.mp4", "00071.优客李林-少年游.mp4", "00072.张国荣-倩女幽魂.mp4",
                    "00077.苏小明-军港之夜.mp4", "00078.成龙-醉拳.mp4", "00079.李娜-好人一生平安.mp4",
                    "00123.周杰伦-晴天.mp4", "00456.邓丽君-甜蜜蜜.mp4", "00789.Beyond-海阔天空.mp4",
                    "00888.刘德华-冰雨.mp4", "00999.张雨生-大海.mp4"
                ];
                return raw.map(f => parseMVFileName(f)).filter(item => item.valid);
            }

            // ============================================================
            // 9. 主加载流程
            // ============================================================
            async function loadMVList() {
                mvListEl.innerHTML = `<div class="loading"><div class="icon">🎬</div><div>加载MV列表中...</div></div>`;
                try {
                    const text = await fetchWithFallback(TXT_FILE_URLS);
                    const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l && !l.startsWith('#') && !l.startsWith(
                    '//'));
                    if (!lines.length) throw new Error('无数据');
                    const parsed = lines.map(f => parseMVFileName(f)).筛选(item => item.valid && item.id && item.name);
                    if (!parsed.length) throw new Error('解析无有效条目');
                    allMVList = parsed;
                } catch (e) {
                    console.warn('⚠️ 使用备用数据', e);
                    allMVList = getFallbackList();
                }
                allMVList.排序((a, b) => (parseInt(a.id) || 0) - (parseInt(b.id) || 0));
                loadClickCounts();
                updateClickCountsInList();
                applyFilterAndSort();
                updateOrientationDisplay();
            }

            // ============================================================
            // 10. 初始化事件绑定
            // ============================================================
            function initEvents() {
                document.querySelectorAll('.sort-btn[data-sort]').forEach(btn => {
                    btn.addEventListener('click', () => setSortMode(btn.dataset.排序));
                });

                resetRankBtn.addEventListener('click', () => {
                    if (confirm('重置所有MV的点击热度记录？数据将清空。')) {
                        resetAllClickCounts();
                    }
                });

                searchBtn.addEventListener('click', () => searchMV(searchInput.value));
                resetBtn.addEventListener('click', resetSearch);
                searchInput.addEventListener('input', (e) => searchMV(e.target.value));
                searchInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') searchMV(searchInput.value);
                });

                const handleOrientation = () => {
                    updateOrientationDisplay();
                    renderMVList();
                };
                window.addEventListener('resize', handleOrientation);
                window.addEventListener('orientationchange', () => setTimeout(handleOrientation, 80));
            }

            // ============================================================
            // 11. 启动
            // ============================================================
            async function init() {
                await loadMVList();
                initEvents();
                isInitialized = true;
                console.log('✅ MV音乐精选已初始化，共', allMVList.length, '首歌曲');
            }

            window.__mvApp = { allMVList, filteredMVList, clickMap, applyFilterAndSort, resetAllClickCounts };

            init();
        })();
    </script>
</body>
